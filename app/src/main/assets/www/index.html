<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090a0c">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="modules/categories.css">
<title>Faberlic Forever</title>
</head>
<body>
<div class="appShell" id="appShell">
  <header class="fixedTop">
    <div class="fixedTopInner">
      <div class="homeHeader" id="homeHeader">
        <div class="brand">
          <img src="assets/app-icon.png" alt="">
          <div><b>Faberlic Forever</b></div>
        </div>
        <button class="langButton" id="langButtonHome" onclick="openLanguageSheet()" aria-label="Язык">RU</button>
      </div>
      <div class="sectionHeader" id="sectionHeader" hidden>
        <h1 id="sectionHeaderTitle">Категории</h1>
        <button class="langButton" id="langButtonSection" onclick="openLanguageSheet()" aria-label="Язык">RU</button>
      </div>
    </div>
  </header>

  <main class="app" id="scrollArea">
    <section class="page active" id="home">
      <div id="heroWrap"></div>

      <div class="search">
        <label class="searchbox">
          <span class="searchIcon">⌕</span>
          <input id="search" placeholder="Найти обучение..." autocomplete="off">
        </label>
      </div>

      <div class="chips" id="chips"></div>

      <section class="sec">
        <div class="head">
          <h2 id="continueTitle">Продолжить просмотр</h2>
          <button id="historyBtn">История</button>
        </div>
        <button class="continue" onclick="openVideo('v2')">
          <div class="preview"><span>▶</span></div>
          <div class="continueText">
            <b id="continueVideoTitle">Как приглашать без давления</b>
            <small id="continueVideoMeta">Урок 3 из 5 · осталось 8 мин</small>
            <div class="progress"><i></i></div>
          </div>
        </button>
      </section>

      <section class="sec">
        <div class="head">
          <h2 id="newTitle">Новинки</h2>
          <button id="allNewBtn" onclick="go('categories')">Все</button>
        </div>
        <div class="videoGrid" id="videoGrid"></div>
      </section>
    </section>

    <section class="page" id="categories">

      <div class="list" id="categoryList"></div>
      <div id="learningDirectory" hidden></div>
    </section>

    <section class="page" id="live">

      <div class="list" id="liveList"></div>
    </section>

    <section class="page" id="materials">
      <p class="sub pageIntro" id="materialsSub">Памятки, инструкции, презентации и чек-листы.</p>
      <div class="list" id="materialList"></div>
    </section>

    <section class="page" id="saved">
      <p class="sub pageIntro" id="savedSub">Сохранённые уроки будут собраны здесь.</p>
      <div id="savedList"></div>
    </section>
  </main>

  <nav class="bottom" aria-label="Навигация">
    <button class="nav active" data-page="home" onclick="go('home')">
      <span class="navIcon"><svg viewBox="0 0 24 24"><path d="M3.5 11.4 12 4.2l8.5 7.2v8.4h-5.7v-6H9.2v6H3.5z"/></svg></span>
      <span class="navLabel" data-nav="home">Главная</span>
    </button>
    <button class="nav" data-page="categories" onclick="go('categories')">
      <span class="navIcon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></span>
      <span class="navLabel" data-nav="categories">Категории</span>
    </button>
    <button class="nav live" data-page="live" onclick="go('live')">
      <span class="liveCircle"><svg viewBox="0 0 24 24"><path d="M8.3 5.4v13.2L19 12z"/></svg></span>
      <span class="navLabel" data-nav="live">Эфиры</span>
    </button>
    <button class="nav" data-page="materials" onclick="go('materials')">
      <span class="navIcon"><svg viewBox="0 0 24 24"><path d="M7 3.5h7l3.5 3.6v13.4H7z"/><path class="stroke" d="M14 3.8v4h3.8M10 12.5h4.8M10 16.5h4.8"/></svg></span>
      <span class="navLabel" data-nav="materials">Материалы</span>
    </button>
    <button class="nav" data-page="saved" onclick="go('saved')">
      <span class="navIcon"><svg viewBox="0 0 24 24"><path d="M12 21s-7.15-4.56-9.33-8.24C.46 9.03 3 4.8 6.88 4.8c2.1 0 4 1.03 5.12 2.68 1.12-1.65 3.02-2.68 5.12-2.68 3.88 0 6.42 4.23 4.21 7.96C19.15 16.44 12 21 12 21z"/></svg></span>
      <span class="navLabel" data-nav="saved">Избранное</span>
    </button>
  </nav>
</div>

<div class="overlay" id="lessonOverlay">
  <article class="lesson">
    <div class="lessonTop">
      <button class="backBtn" onclick="closeLesson()" aria-label="Назад">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5.5 8.5 12 15 18.5"/></svg>
      </button>
      <b id="lessonHeader">Урок</b>
      <button id="favoriteBtn" class="favoriteBtn" onclick="toggleCurrentFavorite()" type="button" aria-label="В избранное" aria-pressed="false" title="В избранное"></button>
    </div>

    <div class="playerShell" id="lessonPlayerShell">
      <button class="fullscreenExit" id="fullscreenExit" type="button" onclick="exitLessonFullscreen()" aria-label="Выйти из полноэкранного режима">✕</button>
      <div class="player vertical" id="player">
        <div id="playerContent">
          <button class="bigPlay" aria-label="Воспроизвести">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 6.8 17 12l-7.8 5.2z"/></svg>
          </button>
          <small id="playerPlaceholder">Видео подключим к YouTube</small>
        </div>
      </div>
    </div>

    <div class="lessonPlayerControls"><div class="lessonMeta" id="lessonCat"></div><button class="lessonFullscreenBtn" type="button" id="lessonFullscreenBtn" onclick="expandLessonVideo()" aria-label="Смотреть на весь экран"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg><span>На весь экран</span></button></div>
    <h2 id="lessonTitle"></h2>
    <p id="lessonDesc"></p>

  </article>
</div>

<div class="langOverlay" id="langOverlay" onclick="if(event.target===this)closeLanguageSheet()">
  <div class="langSheet">
    <div class="langHandle"></div>
    <div class="langSheetHead">
      <div>
        <b id="langSheetTitle">Язык приложения</b>
        <small id="langSheetSub">Выберите язык</small>
      </div>
      <button class="langClose" onclick="closeLanguageSheet()">×</button>
    </div>
    <div class="langOptions">
      <button class="langOption" data-lang="ru" onclick="setLanguage('ru')">
        <span class="langCode">RU</span><span><b>Русский</b><small>Русский язык</small></span><i>✓</i>
      </button>
      <button class="langOption" data-lang="tj" onclick="setLanguage('tj')">
        <span class="langCode">TJ</span><span><b>Тоҷикӣ</b><small>Тоҷикии оддӣ</small></span><i>✓</i>
      </button>
      <button class="langOption" data-lang="uz" onclick="setLanguage('uz')">
        <span class="langCode">UZ</span><span><b>Ўзбекча</b><small>Ўзбекча, кирилл</small></span><i>✓</i>
      </button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<!-- Stable, isolated feature modules; load order intentionally fixed. -->
<script src="modules/learning-paths-data.js"></script>
<script src="core/core.js"></script>
<script src="modules/youtube-covers.js"></script>
<script src="modules/home.js"></script>
<script src="modules/categories.js"></script>
<script src="core/category-availability.js"></script>
<script src="modules/categories-cms.js"></script>
<script src="modules/live.js"></script>
<script src="modules/materials.js"></script>
<script src="modules/favorites.js"></script>
<script src="modules/lesson.js"></script>
<script src="core/navigation.js"></script>
<script src="modules/firebase-lessons.js"></script>
</body>
</html>
