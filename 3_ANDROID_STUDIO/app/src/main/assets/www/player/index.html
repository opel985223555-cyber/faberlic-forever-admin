<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Faberlic Forever · YouTube player</title>
<style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#090A0C; }
  iframe { display:block; width:100%; height:100%; border:0; background:#090A0C; }
</style>
</head>
<body>
<script>
(function(){
  'use strict';
  // Only the 11-character YouTube ID is accepted; no arbitrary external URL.
  var id = new URLSearchParams(location.search).get('v') || '';
  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return;
  var iframe = document.createElement('iframe');
  iframe.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?playsinline=1';
  iframe.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
  iframe.setAttribute('allow','accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen');
  iframe.setAttribute('allowfullscreen','');
  iframe.title = 'YouTube video';
  document.body.appendChild(iframe);
})();
</script>
</body>
</html>
